org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 云端分片数据地址：仓库内 data/ 目录经 jsDelivr 加速后的公共前缀。
# 冷门诗词的正文按需从这里拉取（单片约 0.4 MB，覆盖 1000 首，下载后永久缓存）。
# 换托管平台只需改这一行；留空则只使用内置数据。
poetry.dataBaseUrl=https://cdn.jsdelivr.net/gh/wenyinos/poetry-app@main/data
