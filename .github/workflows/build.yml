name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      data_base_url:
        description: '云端数据地址（dist/remote 上传后的公共前缀）；留空则仅用内置数据'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ubuntu runner 已预装 Android SDK，无需 android-actions/setup-android
      # （该 action 会执行已被移除的 `sdkmanager tools`，与新版 SDK 不兼容）。
      # 这里只需补齐 compileSdk 对应的 platform 与 build-tools。
      - name: Install SDK components
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          echo "--- 预装 platform ---"
          ls "$SDK_ROOT/platforms" 2>/dev/null || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          DATA_BASE_URL: ${{ github.event.inputs.data_base_url }}
        run: |
          # 未手动填写数据地址时沿用 gradle.properties 里的默认值，
          # 避免用空值覆盖掉仓库内的配置
          if [ -n "$DATA_BASE_URL" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Ppoetry.dataBaseUrl="$DATA_BASE_URL"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Show output
        if: always()
        run: ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shijing-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
