name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      data_base_url:
        description: '云端数据地址；留空则使用 gradle.properties 中的默认值'
        required: false
        default: ''

# 推送 v* 标签时需要创建 Release，因此需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ubuntu runner 已预装 Android SDK，无需 android-actions/setup-android
      # （该 action 会执行已被移除的 `sdkmanager tools`，与新版 SDK 不兼容）。
      # 这里只需补齐 compileSdk 对应的 platform 与 build-tools。
      - name: Install SDK components
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 使用固定的发布密钥，保证每次构建出来的 APK 签名一致、可以覆盖升级。
      # 未配置 Secret 时回退到 debug 签名 —— 注意 CI 上的 debug 密钥每次都会
      # 重新生成，那样每次升级都得先卸载旧版。
      #
      # 这里用 run 内部判断而不是 step 的 if：secrets 上下文不保证能在 if 里使用，
      # 放在 if 中会导致整个 workflow 解析失败。
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "签名密钥已解码：$(stat -c%s "$RUNNER_TEMP/release.jks") 字节"
          else
            echo "未配置签名密钥，本次使用 debug 签名"
          fi

      - name: Build release APK
        env:
          DATA_BASE_URL: ${{ github.event.inputs.data_base_url }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 未手动填写数据地址时沿用 gradle.properties 里的默认值，
          # 避免用空值覆盖掉仓库内的配置
          if [ -n "$DATA_BASE_URL" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Ppoetry.dataBaseUrl="$DATA_BASE_URL"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            NAME="shijing-${GITHUB_REF_NAME}.apk"
          else
            NAME="shijing-${GITHUB_SHA::7}.apk"
          fi
          mv app-release.apk "$NAME"
          ls -lh "$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shijing-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 推送 v* 标签时创建 Release，APK 作为附件 —— 无需登录 GitHub 即可下载
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          # 发布说明单独成文放在 .github/release-notes.md，改文案不必动 workflow
          body_path: .github/release-notes.md
