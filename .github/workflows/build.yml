name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      data_base_url:
        description: '云端数据地址；留空则使用 gradle.properties 中的默认值'
        required: false
        default: ''

# 推送 v* 标签时需要创建 Release，因此需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ubuntu runner 已预装 Android SDK，无需 android-actions/setup-android
      # （该 action 会执行已被移除的 `sdkmanager tools`，与新版 SDK 不兼容）。
      # 这里只需补齐 compileSdk 对应的 platform 与 build-tools。
      - name: Install SDK components
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          DATA_BASE_URL: ${{ github.event.inputs.data_base_url }}
        run: |
          # 未手动填写数据地址时沿用 gradle.properties 里的默认值，
          # 避免用空值覆盖掉仓库内的配置
          if [ -n "$DATA_BASE_URL" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Ppoetry.dataBaseUrl="$DATA_BASE_URL"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            NAME="shijing-${GITHUB_REF_NAME}.apk"
          else
            NAME="shijing-${GITHUB_SHA::7}.apk"
          fi
          mv app-release.apk "$NAME"
          ls -lh "$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shijing-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 推送 v* 标签时创建 Release，APK 作为附件 —— 无需登录 GitHub 即可下载
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ## 诗鲸 · 离线重写版 ${{ github.ref_name }}

            下载下方 APK 直接安装。使用 debug 签名，与官方原版诗鲸签名不同，
            **安装前请先卸载原版**。

            **功能**
            - 内置全部 72,417 首诗词索引、5,764 条名句、热门 5000 首正文，**断网可读**
            - 冷门诗词按需从 jsDelivr 拉取，一次下载覆盖 1000 首并永久缓存
            - 桌面小组件（3 小时自动更换，支持锁屏与自由缩放）
            - 收藏：本地存储 + WebDAV 同步（数据存您自己的网盘，不需要账号）

            **规格**：minSdk 28（Android 9）/ targetSdk 36；纯 Kotlin，支持 64 位

            **数据来源**：[libpoetry/poetry-1](https://github.com/libpoetry/poetry-1)（GPL-3.0）
